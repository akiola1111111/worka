{% extends "web/base.html" %}
{% block title %}Worker login - Worka{% endblock %}
{% block content %}
<form method="post" class="card">
  {% csrf_token %}
  <h2 style="margin-top:0">Worker login</h2>
  <label>Phone number</label>
  <input name="phone_number" type="tel" required placeholder="0244123456">
  <button class="btn" type="submit">Log in</button>
  <p class="muted" style="margin-top:12px">New here? <a href="{% url 'web:portal_register' %}"><u>Register</u></a></p>
</form>
{% endblock %}
